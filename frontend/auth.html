<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scholaris - Login & Sign Up</title>

    <!-- CONNECT CSS -->
    <link rel="stylesheet" href="auth.css">
</head>
<body>
    <div class="container">
        <div class="logo-container">
            <img src="assets\logo.png" alt="Scholaris Logo">
        </div>
        
        <h1 class="welcome-text" id="welcomeText">Welcome Back!</h1>

        <div class="toggle-buttons">
            <button class="toggle-btn active" id="loginToggle" onclick="showLogin()">LOG IN</button>
            <button class="toggle-btn" id="signupToggle" onclick="showSignup()">SIGN UP</button>
        </div>

        <div id="errorMessage" class="error-message"></div>
        <div id="successMessage" class="success-message"></div>

        <!-- Login Form -->
        <div id="loginForm" class="form-container active">
            <form onsubmit="handleLogin(event)">
                <div class="input-group">
                    <label for="loginEmail">Email Address</label>
                    <input type="email" id="loginEmail" placeholder="Enter your email" required>
                </div>
                <div class="input-group">
                    <label for="loginPassword">Password</label>
                    <input type="password" id="loginPassword" placeholder="Enter your password" required>
                </div>
                <div class="forgot-password">
                    <a href="#" onclick="handleForgotPassword(event)">Forgot Password?</a>
                </div>
                <button type="submit" class="submit-btn">LOG IN</button>
            </form>

            <div class="divider">
                <span>OR</span>
            </div>

            <div class="social-buttons">
                <button class="social-btn" onclick="handleGoogleLogin()">
                    <img src="assets\google.png" alt="Google">
                    <span>Continue with Google</span>
                </button>
                <button class="social-btn" onclick="handlePhoneLogin()">
                    <img src="assets\phone.png" alt="Phone">
                    <span>Continue with Phone Number</span>
                </button>
            </div>
        </div>

        <!-- Signup Form -->
        <div id="signupForm" class="form-container">
            <form onsubmit="handleSignup(event)">
                <div class="input-group">
                    <label for="signupName">Full Name</label>
                    <input type="text" id="signupName" placeholder="Enter your full name" required>
                </div>
                <div class="input-group">
                    <label for="signupEmail">Email Address</label>
                    <input type="email" id="signupEmail" placeholder="Enter your email" required>
                </div>
                <div class="input-group">
                    <label for="signupPassword">Password</label>
                    <input type="password" id="signupPassword" placeholder="Create a password" required minlength="6">
                </div>
                <div class="input-group">
                    <label for="signupConfirmPassword">Confirm Password</label>
                    <input type="password" id="signupConfirmPassword" placeholder="Confirm your password" required minlength="6">
                </div>
                <button type="submit" class="submit-btn">SIGN UP</button>
            </form>

            <div class="divider">
                <span>OR</span>
            </div>

            <div class="social-buttons">
                <button class="social-btn" onclick="handleGoogleSignup()">
                    <img src="assets\google.png" alt="Google">
                    <span>Sign up with Google</span>
                </button>
                <button class="social-btn" onclick="handlePhoneSignup()">
                    <img src="assets\phone.png" alt="Phone">
                    <span>Continue with Phone Number</span>
                </button>
            </div>
        </div>
    </div>

    <!-- CONNECT JS -->
    <script src="auth.js"></script>
</body>
</html>
